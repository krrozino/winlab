name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  windows-powershell:
    name: Generated PowerShell on Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate representative WinLab scripts
        run: npm run fixtures

      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\validate-generated-powershell.ps1

      - name: Validate syntax with PowerShell 7
        shell: pwsh
        run: .\scripts\validate-generated-powershell.ps1 -ParserOnly

  desktop-windows:
    name: WinLab Desktop on Windows (.NET 10 & WPF)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Export Desktop Static Assets
        shell: bash
        run: npm run build:desktop

      - name: Restore .NET Solution Dependencies
        run: dotnet restore desktop/WinLab.sln

      - name: Build WinLab Desktop (Release)
        run: dotnet build desktop/WinLab.sln -c Release --no-restore

      - name: Run C# Unit Tests
        run: dotnet test desktop/WinLab.sln -c Release --no-build --verbosity normal

      - name: Publish Self-Contained Desktop Application
        run: dotnet publish desktop/src/WinLab.Desktop/WinLab.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish/desktop

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          iscc desktop\packaging\winlab.iss

      - name: Upload Published Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winlab-desktop-win-x64
          path: artifacts/publish/desktop/

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinLab-Desktop-Installer-x64
          path: artifacts/installers/*.exe


