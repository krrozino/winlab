name: CI

on:
  pull_request:
    branches:
      - main
      - 'dev/**'
      - 'feat/**'
      - 'vibe/**'
  push:
    branches: [main, dev/desktop-functional]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  windows-powershell:
    name: Generated PowerShell on Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate representative WinLab scripts
        run: npm run fixtures

      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\validate-generated-powershell.ps1

      - name: Validate syntax with PowerShell 7
        shell: pwsh
        run: .\scripts\validate-generated-powershell.ps1 -ParserOnly

  desktop-windows:
    name: WinLab Desktop on Windows (.NET 10 & WPF)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Export Desktop Static Assets
        shell: pwsh
        run: npm run build:desktop

      - name: Validate Offline Assets Before .NET Build
        shell: pwsh
        run: |
          $entry = "desktop/src/WinLab.Desktop/wwwroot/desktop/index.html"
          if (-not (Test-Path $entry)) {
            Write-Error "Missing offline entry point: $entry"
            exit 1
          }
          if ((Get-Item $entry).Length -le 0) {
            Write-Error "Offline entry point is empty: $entry"
            exit 1
          }
          Write-Host "Offline entry point OK: $entry ($((Get-Item $entry).Length) bytes)"

      - name: Restore .NET Solution Dependencies
        run: dotnet restore desktop/WinLab.sln

      - name: Build WinLab Desktop (Release)
        run: dotnet build desktop/WinLab.sln -c Release --no-restore

      - name: Run C# Unit Tests
        run: dotnet test desktop/WinLab.sln -c Release --no-build --verbosity normal

      - name: Publish Self-Contained Desktop Application
        run: dotnet publish desktop/src/WinLab.Desktop/WinLab.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish/desktop

      - name: Publish Elevated Executor Helper
        run: dotnet publish desktop/src/WinLab.Executor/WinLab.Executor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish/desktop

      - name: Validate Published Artifacts
        shell: pwsh
        run: |
          $version = (Select-Xml -Path "desktop/src/WinLab.Desktop/WinLab.Desktop.csproj" -XPath "/Project/PropertyGroup/Version").Node.InnerText
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid Desktop version: $version" }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne $version) { throw "Interface version mismatch" }
          "WINLAB_CANDIDATE_VERSION=$version" >> $env:GITHUB_ENV
          $exe = "artifacts/publish/desktop/WinLab.Desktop.exe"
          $helper = "artifacts/publish/desktop/WinLab.Executor.exe"
          $entry = "artifacts/publish/desktop/wwwroot/desktop/index.html"
          if (-not (Test-Path $exe)) {
            Write-Error "Missing published executable: $exe"
            exit 1
          }
          if ((Get-Item $exe).Length -le 0) {
            Write-Error "Published executable is empty: $exe"
            exit 1
          }
          if (-not (Test-Path $helper)) {
            Write-Error "Missing elevated executor helper: $helper"
            exit 1
          }
          if ((Get-Item $helper).Length -le 0) {
            Write-Error "Elevated executor helper is empty: $helper"
            exit 1
          }
          if (-not (Test-Path $entry)) {
            Write-Error "Published package is missing offline assets: $entry"
            exit 1
          }
          if ((Get-Item $entry).Length -le 0) {
            Write-Error "Published offline entry point is empty: $entry"
            exit 1
          }
          foreach ($binary in @($exe, $helper)) {
            $built = (Get-Item -LiteralPath $binary).VersionInfo
            if ("$($built.FileMajorPart).$($built.FileMinorPart).$($built.FileBuildPart)" -ne $version) {
              throw "Version mismatch for $binary"
            }
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Set-Content -Path "$exe.sha256" -Value $hash
          Write-Host "Published executable OK ($((Get-Item $exe).Length) bytes), SHA256: $hash"
          $helperHash = (Get-FileHash $helper -Algorithm SHA256).Hash
          Set-Content -Path "$helper.sha256" -Value $helperHash
          Write-Host "Elevated executor helper OK ($((Get-Item $helper).Length) bytes), SHA256: $helperHash"

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          iscc desktop\packaging\winlab.iss

      - name: Validate Installer Artifact
        shell: pwsh
        run: |
          $installers = Get-ChildItem "artifacts/installers/*.exe" -ErrorAction SilentlyContinue
          if (-not $installers -or $installers.Count -eq 0) {
            Write-Error "No installer produced under artifacts/installers/"
            exit 1
          }
          foreach ($installer in $installers) {
            if ($installer.Length -le 0) {
              Write-Error "Installer is empty: $($installer.FullName)"
              exit 1
            }
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
            Set-Content -Path "$($installer.FullName).sha256" -Value $hash
            Write-Host "Installer OK: $($installer.Name) ($($installer.Length) bytes), SHA256: $hash"
          }

      - name: Verify Inno Installed Payload
        shell: pwsh
        run: |
          $version = $env:WINLAB_CANDIDATE_VERSION
          $installer = Get-Item -LiteralPath "artifacts/installers/WinLabSetup-$version-x64.exe"
          $built = $installer.VersionInfo
          if ("$($built.FileMajorPart).$($built.FileMinorPart).$($built.FileBuildPart)" -ne $version) {
            throw "Inno installer version mismatch"
          }
          $installedRoot = Join-Path $env:ProgramFiles "WinLab"
          if (Test-Path -LiteralPath $installedRoot) { throw "WinLab is already installed on this runner" }
          $result = Start-Process -FilePath $installer.FullName -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', '/NOCANCEL'
          ) -PassThru -Wait -WindowStyle Hidden
          if ($result.ExitCode -ne 0) { throw "Inno installation failed with code $($result.ExitCode)" }

          $publishedRoot = (Resolve-Path "artifacts/publish/desktop").Path
          $assets = @(Get-ChildItem -LiteralPath (Join-Path $publishedRoot "wwwroot") -Recurse -File)
          if ($assets.Count -eq 0) { throw "Offline interface was not included" }
          $expected = @(
            (Join-Path $publishedRoot "WinLab.Desktop.exe"),
            (Join-Path $publishedRoot "WinLab.Executor.exe")
          ) + @($assets.FullName)
          foreach ($file in $expected) {
            $relative = [IO.Path]::GetRelativePath($publishedRoot, $file)
            $installed = Join-Path $installedRoot $relative
            if ((Get-FileHash -LiteralPath $file).Hash -ne (Get-FileHash -LiteralPath $installed).Hash) {
              throw "Installed payload differs from output for $relative"
            }
          }
          $registered = Get-ItemPropertyValue -LiteralPath "HKLM:\SOFTWARE\WinLab\DesktopInstallation" -Name ExecutorSha256
          if ($registered -ne (Get-FileHash -LiteralPath (Join-Path $installedRoot "WinLab.Executor.exe")).Hash) {
            throw "Executor digest registered by the installer does not match the installed binary"
          }
          "WINLAB_VERIFIED_OFFLINE_FILES=$($assets.Count)" >> $env:GITHUB_ENV

      - name: Package Auto-Updatable Desktop
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tools vpk --version 1.2.161
          .\.tools\vpk.exe pack --packId WinLab.Desktop --packTitle "WinLab" --packVersion "$env:WINLAB_CANDIDATE_VERSION" --packDir artifacts/publish/desktop --mainExe WinLab.Desktop.exe --runtime win-x64 --outputDir artifacts/velopack --delta none
          $installer = Get-ChildItem "artifacts/velopack/*-Setup.exe" -ErrorAction SilentlyContinue
          $feed = Get-ChildItem "artifacts/velopack/releases.*.json" -ErrorAction SilentlyContinue
          $package = Get-ChildItem "artifacts/velopack/*-full.nupkg" -ErrorAction SilentlyContinue
          if (-not $installer -or -not $feed -or -not $package) {
            Write-Error "Velopack installer, feed or full update package missing"
            exit 1
          }
          Write-Host "Auto-update package ready: $($installer[0].Name)"

      - name: Record Candidate Versions and Checksums
        shell: pwsh
        run: |
          $version = $env:WINLAB_CANDIDATE_VERSION
          $portable = "artifacts/publish/desktop"
          $velopack = @(Get-ChildItem "artifacts/velopack" -File)
          $full = @($velopack | Where-Object { $_.Name -like "*-$version-full.nupkg" })
          if ($full.Count -ne 1) { throw "Velopack package version mismatch" }
          $archive = [IO.Compression.ZipFile]::OpenRead($full[0].FullName)
          try {
            foreach ($relative in @("WinLab.Desktop.exe", "WinLab.Executor.exe", "wwwroot/desktop/index.html")) {
              $entries = @($archive.Entries | Where-Object { $_.FullName.EndsWith("/$relative", [StringComparison]::Ordinal) })
              if ($entries.Count -ne 1) { throw "Missing or duplicate Velopack entry $relative" }
              $stream = $entries[0].Open()
              try { $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream)) }
              finally { $stream.Dispose() }
              if ($hash -ne (Get-FileHash -LiteralPath (Join-Path $portable $relative)).Hash) {
                throw "Velopack payload differs for $relative"
              }
            }
          } finally { $archive.Dispose() }

          $setup = Get-Item "artifacts/installers/WinLabSetup-$version-x64.exe"
          $files = @(
            (Get-Item "$portable/WinLab.Desktop.exe"),
            (Get-Item "$portable/WinLab.Executor.exe"),
            $setup
          ) + @($velopack | Where-Object { $_.Extension -in @(".exe", ".zip", ".nupkg") })
          $digests = @(foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            Set-Content -LiteralPath "$($file.FullName).sha256" -Value $hash -Encoding ascii
            [ordered]@{
              name = $file.Name
              sha256 = $hash
              bytes = $file.Length
              authenticode = if ($file.Extension -eq ".exe") { (Get-AuthenticodeSignature -FilePath $file.FullName).Status.ToString() } else { $null }
            }
          })
          [ordered]@{
            version = $version
            head = $env:GITHUB_SHA
            verifiedInnoOfflineFiles = [int]$env:WINLAB_VERIFIED_OFFLINE_FILES
            files = $digests
          } | ConvertTo-Json -Depth 4 | Set-Content "$portable/candidate.json" -Encoding utf8

      - name: Upload Auto-Updatable Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: WinLab-AutoUpdate-Installer-x64
          if-no-files-found: error
          path: artifacts/velopack/

      - name: Upload Published Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winlab-desktop-win-x64
          if-no-files-found: error
          path: |
            artifacts/publish/desktop/
            artifacts/publish/desktop/WinLab.Desktop.exe.sha256

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinLab-Desktop-Installer-x64
          if-no-files-found: error
          path: |
            artifacts/installers/*.exe
            artifacts/installers/*.exe.sha256
